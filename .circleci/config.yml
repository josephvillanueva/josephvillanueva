version: 2.1

parameters:
  force_full:
    type: boolean
    default: false

jobs:
  validate-docs:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install pinned documentation validators
          command: python -m pip install --disable-pip-version-check -r .circleci/requirements.txt
      - run:
          name: Validate Markdown, local file links, and YAML
          command: python .circleci/validate_docs.py

workflows:
  documentation:
    when:
      or:
        - << pipeline.parameters.force_full >>
        - not:
            equal: ["main", << pipeline.git.branch >>]
    jobs:
      - validate-docs
